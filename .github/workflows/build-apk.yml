name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://backend-production-5f08.up.railway.app
          NEXT_PUBLIC_KEYCLOAK_URL: https://studentespro.christuniversity.in/auth/realms/Student/protocol/openid-connect/auth
          NEXT_PUBLIC_CLIENT_ID: react-app
          NEXT_PUBLIC_REDIRECT_URI: http://localhost:3000/callback

      - name: Sync Web Assets to Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log || {
            echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/ChristAttendance.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChristAttendance-APK
          path: build-output/ChristAttendance.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Christ Attendance Android App"
          draft: false
          prerelease: false
          body: |
            ## 📱 Christ Attendance & Safe-Skip App for Android

            ### ✨ What's Included:
            - **1-Tap Official Login**: Log in directly via the official Christ University CUE portal in-app.
            - **No Tokens to Copy**: The app automatically captures your session and syncs your authentic courses, attendance, percentages, safe skips, and CIA marks.
            - **Conditional Hostel Attendance**: If you stay in a hostel, shows your biometric punches; if day scholar, automatically hidden.
            - **30-Day Persistence**: Stays logged in on your phone so you never have to sign in again.

            ### 🚀 How to Install:
            1. Download **`ChristAttendance.apk`** below onto your Android phone.
            2. Tap the file in your notifications or Downloads folder to install.
            3. If Android prompts *"Install from unknown sources"*, tap Allow.
            4. Open **Christ Attendance** and tap **"Sign In via Official CUE Portal"**.
          files: build-output/ChristAttendance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

