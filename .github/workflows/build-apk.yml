name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://backend-production-5f08.up.railway.app
          NEXT_PUBLIC_KEYCLOAK_URL: https://studentespro.christuniversity.in/auth/realms/Student/protocol/openid-connect/auth
          NEXT_PUBLIC_CLIENT_ID: react-app
          NEXT_PUBLIC_REDIRECT_URI: http://localhost:3000/callback

      - name: Sync Web Assets to Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon > gradle.log 2>&1 || {
            echo "GRADLE_FAILED=true" >> $GITHUB_ENV
          }

      - name: Commit Log If Failed
        if: env.GRADLE_FAILED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp frontend/android/gradle.log ./gradle.log
          git add gradle.log
          git commit -m "add gradle log"
          git push -f origin debug-log
          exit 1

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found anywhere in workspace!"
            find . -name "*apk*"
            exit 1
          fi
          echo "✅ Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/ChristAttendance.apk
          ls -lh build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChristAttendance-APK
          path: build-output/ChristAttendance.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Christ Attendance Android App"
          draft: false
          prerelease: false
          body: |
            ## 📱 Christ Attendance & Safe-Skip App for Android

            ### ✨ What's Included:
            - **1-Tap Official Login**: Log in directly via the official Christ University CUE portal in-app.
            - **No Tokens to Copy**: The app automatically captures your session and syncs your authentic courses, attendance, percentages, safe skips, and CIA marks.
            - **Conditional Hostel Attendance**: If you stay in a hostel, shows your biometric punches; if day scholar, automatically hidden.
            - **30-Day Persistence**: Stays logged in on your phone so you never have to sign in again.

            ### 🚀 How to Install:
            1. Download **`ChristAttendance.apk`** below onto your Android phone.
            2. Tap the file in your notifications or Downloads folder to install.
            3. If Android prompts *"Install from unknown sources"*, tap Allow.
            4. Open **Christ Attendance** and tap **"Sign In via Official CUE Portal"**.
          files: build-output/ChristAttendance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

